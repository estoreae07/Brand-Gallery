name: Add public product images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-images.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.js
          git diff --staged --quiet || git commit -m "Add public product image links"
          git push
